<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300">
  <title>OpenCode Memory</title>
  <desc>Local observational memory for OpenCode sessions. Pipeline: capture, observe, store, recall.</desc>
  <rect width="960" height="300" rx="24" fill="#1c1917"/>
  <rect x="20" y="20" width="920" height="260" rx="18" fill="#292524" stroke="#44403c"/>
  <text x="48" y="86" fill="#faf6f1" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600">OpenCode Memory</text>
  <rect x="48" y="102" width="72" height="4" rx="2" fill="#fdba74"/>
  <text x="48" y="140" fill="#d6d3d1" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Local observational memory for OpenCode sessions.</text>
  <rect x="48" y="176" width="188" height="68" rx="12" fill="#44403c" stroke="#57534e"/>
  <text x="142" y="216" fill="#faf6f1" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Capture</text>
  <line x1="244" y1="210" x2="268" y2="210" stroke="#fdba74" stroke-width="2"/>
  <polygon points="268,204 282,210 268,216" fill="#fdba74"/>
  <rect x="290" y="176" width="188" height="68" rx="12" fill="#44403c" stroke="#57534e"/>
  <text x="384" y="216" fill="#faf6f1" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Observe</text>
  <line x1="486" y1="210" x2="510" y2="210" stroke="#fdba74" stroke-width="2"/>
  <polygon points="510,204 524,210 510,216" fill="#fdba74"/>
  <rect x="532" y="176" width="188" height="68" rx="12" fill="#44403c" stroke="#57534e"/>
  <text x="626" y="216" fill="#faf6f1" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Store</text>
  <line x1="728" y1="210" x2="752" y2="210" stroke="#fdba74" stroke-width="2"/>
  <polygon points="752,204 766,210 752,216" fill="#fdba74"/>
  <rect x="774" y="176" width="138" height="68" rx="12" fill="#fdba74"/>
  <text x="843" y="216" fill="#1c1917" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Recall</text>
</svg>
